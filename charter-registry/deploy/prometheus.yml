global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: charter
    static_configs:
      - targets: ['127.0.0.1:9085']
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
  - job_name: relay_monitor
    static_configs:
      - targets: ['127.0.0.1:9191']
  - job_name: relay_https
    metrics_path: /probe
    params:
      module: [https_ok]
    static_configs:
      - targets: ['https://inbox.qntm.corpo.llc/healthz']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
  - job_name: public_https
    metrics_path: /probe
    params:
      module: [https_ok]
    static_configs:
      - targets: ['https://charter.qntm.corpo.llc/healthz']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
