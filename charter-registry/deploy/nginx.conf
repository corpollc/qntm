# exe.dev terminates HTTPS and proxies only port 8000 publicly.
# A fixed global key avoids trusting client-supplied forwarding headers.
limit_req_zone $server_name zone=charter_global:1m rate=3r/s;
limit_conn_zone $server_name zone=charter_connections:1m;
log_format charter '$time_iso8601 status=$status duration=$request_time method=$request_method';
server {
    listen 8000 default_server;
    server_name charter.qntm.corpo.llc;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    limit_req zone=charter_global burst=12 nodelay;
    limit_req_status 429;
    limit_conn charter_connections 20;
    limit_conn_status 429;
    access_log /var/log/nginx/charter-access.log charter;
    error_log /var/log/nginx/charter-error.log crit;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location = / { return 302 /v1/info; }
    location = /healthz { proxy_pass http://127.0.0.1:8085; }
    location /v1/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_connect_timeout 2s;
        proxy_read_timeout 35s;
        proxy_send_timeout 10s;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }
    # No public administrative, metrics, backup or filesystem routes.
    location / { return 404; }
}
