# exe.dev terminates HTTPS and proxies only port 8000 publicly.
# Rate and connection limits are keyed per peer address ($binary_remote_addr),
# and /healthz is exempt from limit_req so health probes cannot be starved.
limit_req_zone $binary_remote_addr zone=charter_per_ip:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=charter_connections:10m;
log_format charter '$time_iso8601 status=$status duration=$request_time method=$request_method';
server {
    listen 8000 default_server;
    server_name charter.qntm.corpo.llc;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    access_log /var/log/nginx/charter-access.log charter;
    error_log /var/log/nginx/charter-error.log crit;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Referrer-Policy no-referrer always;
    location = / {
        limit_req zone=charter_per_ip burst=12 nodelay;
        limit_conn charter_connections 20;
        root /usr/local/share/qntm-charter;
        default_type text/html;
        try_files /index.html =404;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8085; }
    location = /checkpoint.js {
        limit_req zone=charter_per_ip burst=12 nodelay;
        limit_conn charter_connections 20;
        root /usr/local/share/qntm-charter;
        default_type application/javascript;
        try_files /checkpoint.js =404;
    }
    location /v1/ {
        limit_req zone=charter_per_ip burst=12 nodelay;
        limit_conn charter_connections 20;
        proxy_pass http://127.0.0.1:8085;
        proxy_connect_timeout 2s;
        proxy_read_timeout 35s;
        proxy_send_timeout 10s;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }
    # No public administrative, metrics, backup or filesystem routes.
    location / {
        limit_req zone=charter_per_ip burst=12 nodelay;
        limit_conn charter_connections 20;
        return 404;
    }
}
