groups:
  - name: charter
    rules:
      - alert: CharterUnavailable
        expr: up{job="charter"} == 0 or probe_success{job="public_https"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: 'Charter service or public HTTPS health check is failing'}
      - alert: CharterCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry{job="public_https"} - time() < 14 * 86400
        for: 10m
        labels: {severity: warning}
        annotations: {summary: 'Charter TLS certificate expires in fewer than 14 days'}
      - alert: CharterCapacity
        expr: qntm_charter_entries / qntm_charter_capacity_entries > 0.8 or qntm_charter_log_bytes / qntm_charter_capacity_log_bytes > 0.8
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Charter log is above 80 percent capacity'}
      - alert: CharterDiskSpace
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"} < 0.2
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Charter VM has less than 20 percent disk space free'}
      - alert: CharterBackupStale
        expr: time() - qntm_charter_backup_timestamp_seconds > 30 * 3600 or absent(qntm_charter_backup_timestamp_seconds)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Charter local snapshot is missing or older than 30 hours'}
  - name: relay
    rules:
      - alert: RelayHTTPSUnavailable
        expr: probe_success{job="relay_https"} == 0 or up{job="relay_https"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: 'External relay DNS, TLS or HTTPS health check is failing'}
      - alert: RelayCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry{job="relay_https"} - time() < 14 * 86400
        for: 10m
        labels: {severity: warning}
        annotations: {summary: 'Relay TLS certificate expires in fewer than 14 days'}
      - alert: RelayMessageProbeFailed
        expr: qntm_relay_probe_success == 0 or time() - qntm_relay_probe_last_attempt_timestamp_seconds > 540 or absent(qntm_relay_probe_success)
        for: 6m
        labels: {severity: critical}
        annotations: {summary: 'External relay encrypted send, live receive or reconnect/replay probe is failing or stale'}
      - alert: RelayTelemetryStale
        expr: up{job="relay_monitor"} == 0 or qntm_relay_stats_scrape_success == 0 or time() - qntm_relay_stats_last_success_timestamp_seconds > 180 or absent(qntm_relay_stats_last_success_timestamp_seconds)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: 'Relay aggregate message and conversation telemetry is unavailable'}
