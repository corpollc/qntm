name: Publish npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish after its full release gate passes
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'
        working-directory: .

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Wait for all release checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_REF_NAME="$RELEASE_TAG" python3 scripts/wait_for_release_gate.py
        working-directory: .

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          package-manager-cache: false
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm install -g npm@11.21.1
        working-directory: .

      - run: npm ci

      - run: npm test

      - run: npm run build

      - run: npm pack --ignore-scripts

      - name: Verify tagged version
        run: python3 ../scripts/check_release.py --tag "$RELEASE_TAG"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: client/*.tgz
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: npm-production-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: package
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          package-manager-cache: false
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.1 --ignore-scripts
      - name: Publish verified artifact
        run: |
          RELEASE_CHANNEL=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then RELEASE_CHANNEL=beta; fi
          npm publish ./package/*.tgz --ignore-scripts --access public --provenance --tag "$RELEASE_CHANNEL"
