name: Publish npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6

      - name: Wait for all release checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_for_release_gate.py
        working-directory: .

      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm install -g npm@11.21.1
        working-directory: .

      - run: npm ci

      - run: npm test

      - run: npm run build

      - run: npm pack --ignore-scripts

      - name: Verify tagged version
        run: python3 ../scripts/check_release.py --tag "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: client/*.tgz
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.1 --ignore-scripts
      - name: Publish verified artifact
        run: |
          RELEASE_CHANNEL=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then RELEASE_CHANNEL=beta; fi
          npm publish package/*.tgz --ignore-scripts --access public --provenance --tag "$RELEASE_CHANNEL"
