name: CI
on:
  workflow_dispatch:
jobs:
  test-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: "22.23.2"
      - run: node -p 'JSON.stringify({node:process.version,undici:process.versions.undici,platform:process.platform,arch:process.arch})'
      - run: npm ci && npm run build
        working-directory: client
      - run: npm ci
        working-directory: worker
      - run: npm ci
        working-directory: integration
      - run: npx vitest run --reporter=verbose --maxWorkers=1 relay-worker.test.ts --testNamePattern='counts concurrent|delivers a recipient|idle-connection boundary'
        working-directory: integration
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: relay-idle-diagnostic-${{ github.run_id }}
          path: integration/test-results
