name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-relay-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: npm test

      - name: Typecheck worker
        run: npm run typecheck

  test-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify publish tarball
        run: npm pack --dry-run

  test-aim-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/aim-chat
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/aim-chat/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client package
        run: npm run build
        working-directory: client

      - name: Install dependencies
        # npm install avoids Rollup's optional dependency bug on Linux runners.
        run: npm install

      - name: Install Rollup Linux binary
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0

      - name: Run tests
        run: npm test

      - name: Build UI
        run: npm run build

  test-tui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/tui
    steps:
      - uses: actions/checkout@v6

      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/tui/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client package
        run: npm run build
        working-directory: client

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TUI
        run: npm run build

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e "python-dist/" && pip install pytest

      - name: Run tests
        run: python -m pytest python-dist/tests/ -v

  test-ui-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            worker/package-lock.json
            gateway-worker/package-lock.json
            ui/aim-chat/package-lock.json
            ui/tui/package-lock.json
            integration/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PTY dependency
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Install and build client
        working-directory: client
        run: npm ci && npm run build

      - name: Install relay worker
        working-directory: worker
        run: npm ci

      - name: Install gateway worker
        working-directory: gateway-worker
        run: npm ci

      - name: Install AIM UI
        working-directory: ui/aim-chat
        run: |
          npm install
          npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0

      - name: Install TUI
        working-directory: ui/tui
        run: npm ci

      - name: Install acceptance harness
        working-directory: integration
        run: npm ci

      - name: Install Chromium
        working-directory: integration
        run: npx playwright install --with-deps chromium

      - name: Exercise the real TUI composer under a PTY
        working-directory: ui/tui
        run: npm test -- pty-smoke.test.ts

      - name: Exercise browser, CLI, gateway, and relay journeys
        working-directory: integration
        run: npm run test:acceptance

      - name: Upload acceptance failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-acceptance-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            integration/test-results/
            ui/tui/test-results/
