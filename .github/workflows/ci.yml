name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify publish tarball
        run: npm pack --dry-run

  test-charter-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: charter-registry/go.mod
          cache-dependency-path: charter-registry/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: go test -race ./... && go vet ./...
        working-directory: charter-registry
      - run: npm ci && npm run build && npm run test:charter-server
        working-directory: client
      - name: Verify deterministic charter vectors
        run: node client/scripts/generate-charter-vectors.mjs && git diff --exit-code -- specs/test-vectors/charter-registry-v02.json

  test-aim-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/aim-chat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/aim-chat/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client package
        run: npm run build
        working-directory: client

      - name: Install dependencies
        # npm install avoids Rollup's optional dependency bug on Linux runners.
        run: npm install

      - name: Install Rollup Linux binary
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build UI
        run: npm run build

  test-tui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/tui
    steps:
      - uses: actions/checkout@v4

      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/tui/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client package
        run: npm run build
        working-directory: client

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build TUI
        run: npm run build

  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e "python-dist/[mcp]" && pip install pytest

      - name: Exercise minimum supported WebSocket client
        if: matrix.python-version == '3.10'
        run: pip install websockets==13.0 tomli

      - name: Run tests
        run: python -m pytest python-dist/tests/ -v

  test-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: client
      - run: npm ci && npm run typecheck
        working-directory: worker
      - run: npm ci && npm run test:relay
        working-directory: integration

  cross-surface-acceptance:
    uses: ./.github/workflows/ui-acceptance.yml
