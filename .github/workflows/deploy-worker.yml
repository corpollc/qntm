name: Deploy Dropbox Relay Worker

on:
  workflow_dispatch:
  push:
    tags: ["v*", "!*-*"]

permissions:
  contents: read
  actions: read

jobs:
  verify-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify-manual
    if: always() && !cancelled() && (needs.verify-manual.result == 'success' || (github.event_name == 'push' && !contains(github.ref_name, '-')))
    runs-on: ubuntu-latest
    concurrency:
      group: worker-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Wait for all release checks
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_for_release_gate.py

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          package-manager-cache: false
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Build shared signature verifier
        run: npm ci && npm run build
        working-directory: client

      - name: Dry-run deploy (build verification)
        run: npx wrangler deploy --dry-run --outdir=dist
        working-directory: worker

      - name: Verify deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy dropbox relay worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
        working-directory: worker

      - name: Configure private aggregate metrics reader
        env:
          METRICS_READ_TOKEN: ${{ secrets.QNTM_RELAY_METRICS_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$METRICS_READ_TOKEN" ]; then
            printf '%s' "$METRICS_READ_TOKEN" | npx wrangler secret put METRICS_READ_TOKEN
          fi
        working-directory: worker

      - name: Report deployed Worker observability settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/report_relay_observability.py
