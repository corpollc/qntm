name: Update Site Version

on:
  push:
    tags: ["v*"]

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check site deploy token
        id: site-token
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "${SITE_DEPLOY_TOKEN}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SITE_DEPLOY_TOKEN not set; skipping site version update."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get version from tag
        if: steps.site-token.outputs.available == 'true'
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Checkout qntm-site
        if: steps.site-token.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          repository: corpollc/qntm-site
          token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          path: site

      - name: Update version.json
        if: steps.site-token.outputs.available == 'true'
        run: |
          cat > site/version.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit and push
        if: steps.site-token.outputs.available == 'true'
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet || (git commit -m "chore: update version to ${{ steps.version.outputs.version }}" && git push)
