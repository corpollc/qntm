name: Cross-surface acceptance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ui-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          package-manager-cache: false
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            worker/package-lock.json
            gateway-worker/package-lock.json
            ui/aim-chat/package-lock.json
            ui/tui/package-lock.json
            integration/package-lock.json
            openclaw-qntm/package-lock.json
            echo-worker/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Prepare Ubuntu package sources
        uses: ./.github/actions/prepare-apt

      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Install external relay monitor dependencies
        run: python -m pip install -r monitoring/requirements.txt

      - name: Install and build client
        working-directory: client
        run: npm ci && npm run build

      - name: Install relay worker
        working-directory: worker
        run: npm ci

      - name: Install gateway worker
        working-directory: gateway-worker
        run: npm ci

      - name: Check gateway security regressions
        working-directory: gateway-worker
        run: npm audit --audit-level=moderate && npm test && npm run typecheck

      - name: Install AIM UI
        working-directory: ui/aim-chat
        run: npm ci

      - name: Install TUI
        working-directory: ui/tui
        run: npm ci

      - name: Install OpenClaw and verify its plugin manifest
        working-directory: openclaw-qntm
        run: npm ci --ignore-scripts && npm run check:manifest

      - name: Install echo Worker dependencies for the complete integration typecheck
        working-directory: echo-worker
        run: npm ci

      - name: Install acceptance harness
        working-directory: integration
        run: npm ci && npm run typecheck

      - name: Install Chromium
        working-directory: integration
        run: npx playwright install --with-deps chromium

      - name: Exercise the real TUI composer under a PTY
        working-directory: ui/tui
        run: npm test -- pty-smoke.test.ts

      - name: Exercise browser, CLI, terminal, native OpenClaw, gateway and relay journeys
        working-directory: integration
        run: npm run test:acceptance

      - name: Upload acceptance failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ui-acceptance-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            integration/test-results/
            ui/tui/test-results/
