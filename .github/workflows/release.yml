name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  gate:
    name: Release gate
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: python3 scripts/check_release.py --tag "$GITHUB_REF_NAME"
      - run: echo "All release checks passed for $GITHUB_SHA"

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify tagged version
        run: python3 scripts/check_release.py --tag "$GITHUB_REF_NAME"

      - name: Build Python package
        run: python -m build python-dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package
          path: python-dist/dist/*
          retention-days: 1

  publish:
    needs: build
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: pypi-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  release:
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: github-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package
          path: python-dist/dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: python-dist/dist/*

      # Requires SITE_DEPLOY_TOKEN secret with repo scope on corpollc/qntm-site
      - name: Update version.json on site
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "SITE_DEPLOY_TOKEN not set; skipping site version update."
            exit 0
          fi
          VERSION="$GITHUB_REF_NAME"
          CONTENT=$(echo -n "{\"version\": \"${VERSION}\"}" | base64 -w0)
          SHA=$(gh api repos/corpollc/qntm-site/contents/version.json --jq '.sha' 2>/dev/null || true)
          ARGS=(
            --method PUT
            -f "message=chore: update version to ${VERSION}"
            -f "content=${CONTENT}"
          )
          if [ -n "$SHA" ]; then
            ARGS+=(-f "sha=${SHA}")
          fi
          gh api repos/corpollc/qntm-site/contents/version.json "${ARGS[@]}"
