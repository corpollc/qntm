name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  gate:
    name: Release gate
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check_release.py --tag "$GITHUB_REF_NAME"
      - run: echo "All release checks passed for $GITHUB_SHA"

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify tagged version
        run: python3 scripts/check_release.py --tag "$GITHUB_REF_NAME"

      - name: Build Python package
        run: python -m build python-dist/

      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: python-dist/dist/*
          retention-days: 1

  publish:
    needs: build
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  release:
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: python-dist/dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: python-dist/dist/*

      # Requires SITE_DEPLOY_TOKEN secret with repo scope on corpollc/qntm-site
      - name: Update version.json on site
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "SITE_DEPLOY_TOKEN not set; skipping site version update."
            exit 0
          fi
          VERSION="$GITHUB_REF_NAME"
          CONTENT=$(echo -n "{\"version\": \"${VERSION}\"}" | base64 -w0)
          SHA=$(gh api repos/corpollc/qntm-site/contents/version.json --jq '.sha' 2>/dev/null || true)
          ARGS=(
            --method PUT
            -f "message=chore: update version to ${VERSION}"
            -f "content=${CONTENT}"
          )
          if [ -n "$SHA" ]; then
            ARGS+=(-f "sha=${SHA}")
          fi
          gh api repos/corpollc/qntm-site/contents/version.json "${ARGS[@]}"
