name: Deploy Gateway Worker

on:
  workflow_dispatch:
  push:
    tags: ["v*", "!*-*"]

permissions:
  contents: read
  actions: read

jobs:
  verify-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify-manual
    if: always() && !cancelled() && (needs.verify-manual.result == 'success' || (github.event_name == 'push' && !contains(github.ref_name, '-')))
    runs-on: ubuntu-latest
    concurrency:
      group: gateway-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Wait for all release checks
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_for_release_gate.py

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          package-manager-cache: false
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            gateway-worker/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client package
        run: npm run build
        working-directory: client

      - name: Install gateway dependencies
        run: npm ci
        working-directory: gateway-worker

      - name: Run gateway tests
        run: npm test
        working-directory: gateway-worker

      - name: Typecheck gateway worker
        run: npm run typecheck
        working-directory: gateway-worker

      - name: Verify deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATE_VAULT_KEY: ${{ secrets.QNTM_GATE_VAULT_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$GATE_VAULT_KEY"

      - name: Upsert gateway vault secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATE_VAULT_KEY: ${{ secrets.QNTM_GATE_VAULT_KEY }}
        run: printf '%s' "$GATE_VAULT_KEY" | npx wrangler secret put GATE_VAULT_KEY
        working-directory: gateway-worker

      - name: Deploy gateway worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
        working-directory: gateway-worker
