name: Deploy AIM UI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Wait for all release checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_for_release_gate.py

      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/aim-chat/package-lock.json

      - name: Install and build client package
        run: npm ci && npm run build
        working-directory: client

      - name: Verify tagged version
        run: python3 scripts/check_release.py --tag "$GITHUB_REF_NAME"

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui/aim-chat

      - name: Build UI
        run: npm run build
        working-directory: ui/aim-chat

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=qntm-aim --branch=main --commit-dirty=true
          workingDirectory: ui/aim-chat
