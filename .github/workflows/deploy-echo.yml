name: Deploy Echo Bot

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

jobs:
  verify-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify-manual
    if: always() && (needs.verify-manual.result == 'success' || github.event_name == 'push')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for all release checks
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_for_release_gate.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: echo-worker/package-lock.json

      - name: Build shared client
        run: npm ci && npm run build
        working-directory: client

      - name: Install echo dependencies
        run: npm ci
        working-directory: echo-worker

      - name: Dry-run deploy (build verification)
        run: npx wrangler deploy --dry-run --outdir=dist
        working-directory: echo-worker

      - name: Verify deploy credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy echo bot
        run: npx wrangler deploy
        working-directory: echo-worker
